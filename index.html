<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murmuration</title>
<style>
:root {
  color-scheme: light;
  --ground: #F0EEED; --bar: #FFFFFF; --ink: #201F1D; --ink-muted: #6B665E; --line: rgba(32,31,29,.13);
  --accent: #0C505D; --accent-ink: #FFFFFF; --focus: #0A7891;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --ground: #0D2828; --bar: #112F2F; --ink: #F8F7F7; --ink-muted: rgba(248,247,247,.72); --line: rgba(255,255,255,.14);
    --accent: #C9FEFF; --accent-ink: #0D2828; --focus: #C9FEFF;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: grid; grid-template-rows: auto minmax(0, 1fr);
  background: var(--ground); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 14px;
  -webkit-font-smoothing: antialiased;
}
header {
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  padding: 10px 20px; background: var(--bar); border-bottom: 1px solid var(--line);
}
h1 { font-size: 18px; font-weight: 500; letter-spacing: -.01em; margin: 0; }
nav { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
nav a {
  display: block; padding: 6px 14px; border-radius: 7px; color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 500;
}
nav a:hover { background: var(--line); }
nav a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
nav a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
main { position: relative; min-height: 0; }
iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--ground); }
iframe[hidden] { display: none; }
@media (max-width: 860px) {
  header { padding: 10px 12px; gap: 10px; }
}
</style>
</head>
<body>
<header>
  <h1>Murmuration</h1>
  <nav aria-label="Murmuration type">
    <a href="#animated" data-tool="animated">Animated</a>
    <a href="#still" data-tool="still">Still</a>
  </nav>
</header>
<main id="main"></main>
<script>
(function () {
  "use strict";
  var TOOLS = {
    animated: { src: "animated.html", title: "Animated" },
    still: { src: "still/", title: "Still" }
  };
  var frames = {}, main = document.getElementById("main");
  // Each tool loads the first time it's opened and keeps its settings while you switch between them
  function show(id) {
    if (!TOOLS[id]) id = "animated";
    if (!frames[id]) {
      var f = document.createElement("iframe");
      f.src = TOOLS[id].src; f.title = TOOLS[id].title;
      main.appendChild(f); frames[id] = f;
    }
    Object.keys(frames).forEach(function (k) { frames[k].hidden = k !== id; });
    document.querySelectorAll("nav a").forEach(function (a) {
      if (a.dataset.tool === id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    document.title = TOOLS[id].title + " · Murmuration";
  }
  window.addEventListener("hashchange", function () { show(location.hash.slice(1)); });
  show(location.hash.slice(1));
})();
</script>
</body>
</html>
